name: Wake Florida Landfall Detector

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wake-streamlit.yml'
      - 'scripts/wake_streamlit.py'
      - 'scripts/requirements-wake.txt'
      - 'scripts/test_wake_streamlit.py'

permissions:
  contents: read

concurrency:
  group: wake-streamlit
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SE_AVOID_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install -r scripts/requirements-wake.txt
      - name: Test wake-up detection
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Wake and verify app
        run: python scripts/wake_streamlit.py
